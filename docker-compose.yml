services:
  postgres:
    image: postgres
    container_name: postgres-container
    environment:
      POSTGRES_USER: my_user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data

    ports:
      - "5438:5432"
    networks:
      - app-network

  bank-service:
    build:
      context: .
    environment:
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: my_user
      DB_PASSWORD: 1234
      DB_NAME: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - app-network

networks:
  app-network:

volumes:
  postgres-data:
